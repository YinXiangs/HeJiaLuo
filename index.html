<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启动页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background: url("./img/start_bg.jpg") center / cover no-repeat;
    background-color:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.disc-box{
    cursor:pointer;
}
.disc-img{
    width:420px;
    display:block;
}
@keyframes shake{
    0%{transform:rotate(0deg)}
    20%{transform:rotate(-4deg)}
    40%{transform:rotate(4deg)}
    60%{transform:rotate(-3deg)}
    80%{transform:rotate(3deg)}
    100%{transform:rotate(0deg)}
}
.shake-anim{
    animation:shake 0.4s ease-out;
}
</style>
</head>
<body>
<div class="disc-box" id="startBtn">
    <img class="disc-img" id="discImg" src="./img/zhuanpan.png" alt="光盘点击进入">
</div>

<script>
const startBtn = document.getElementById('startBtn');
const discImg = document.getElementById('discImg');
startBtn.onclick = function(){
    discImg.classList.add('shake-anim');
    setTimeout(()=>{
        window.location.href = "./player.html";
    },400);
}
discImg.addEventListener('animationend',()=>{
    discImg.classList.remove('shake-anim');
})
</script>
</body>
</html>
