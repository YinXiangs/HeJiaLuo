<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐卡片</title>
<script>
(function(){
    const ua = navigator.userAgent;
    const isMobile = /Mobi|Android|iPhone|iPad|iPod|SymbianOS|Windows Phone/i.test(ua);
    if(isMobile){
        document.documentElement.innerHTML = `
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <title>404 Not Found</title>
            <style>
                *{margin:0;padding:0;box-sizing:border-box}
                body{background:#000;color:#999;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
                h1{font-size:48px;margin-bottom:20px;color:#aaa}
                p{font-size:20px}
            </style>
        </head>
        <body>
            <h1>404 Not Found</h1>
            <p>亲在电脑上打开欧</p>
        </body>
        `;
    }
})();
</script>
    <style>
        /* =========角色滤镜调节，在这里修改数值========= */
        :root{
            --char-brightness:1.10;   /*亮度 1原图，大于1变亮*/
            --char-saturate:1.10;     /*饱和度*/
            --char-contrast:1.15;     /*对比度*/
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .wrap {
            width: 100vw;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }
        .music-card {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            background-color: #0b1424;
        }
        .bg-layer-1 {
            width: 100%;
            height: 100%;
            background: url("./img/bg1.png") center / cover no-repeat;
            position: absolute;
            z-index: 1;
        }
        .bg-layer-2 {
            width: 100%;
            height: 100%;
            background: url("./img/bg2.png") center / cover no-repeat;
            opacity: 0.6;
            position: absolute;
            z-index: 2;
        }
        /*角色容器：靠右、放大，完整显示全身*/
        .char-animate-wrap {
            position: absolute;
            left: 0
                %;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            overflow: visible;
        }
        .char-gif {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(var(--char-brightness)) saturate(var(--char-saturate)) contrast(var(--char-contrast));
        }
        .char-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(var(--char-brightness)) saturate(var(--char-saturate)) contrast(var(--char-contrast));
        }
        .music-mask {
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 4;
            background-color: rgba(0, 0, 0, 0.25);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .music-title h1 {
            font-size: 80px;
            color: #40c8ff;
            font-weight: bold;
        }
        .music-title p {
            font-size: 28px;
            color: #cce8ff;
            letter-spacing: 2px;
        }
        .vinyl-wrap {
            position: absolute;
            left: 120px;
            top: 220px;
            width: 380px;
            height: 380px;
            z-index: 5;
        }
        .vinyl {
            width: 100%;
            height: 100%;
            background: url("./img/disc.png") center / contain no-repeat;
            animation: rotateDisc 10s linear infinite;
            animation-play-state: paused;
        }
        .vinyl.play {
            animation-play-state: running;
        }
        @keyframes rotateDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .player-bar {
            width: 100%;
            max-width: 700px;
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #ffffff;
            z-index: 6;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .progress-inner {
            height: 100%;
            width: 0%;
            background: #40c8ff;
            border-radius: 2px;
        }
        .control-group {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid #fff;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        @media (max-width: 768px) {
            .music-title h1 {
                font-size: 42px;
            }
            .music-title p {
                font-size: 18px;
            }
            .vinyl-wrap {
                width: 170px;
                height: 170px;
                left: 24px;
                top: 160px;
            }
            .music-mask {
                padding: 24px;
            }
            .player-bar {
                left: 24px;
                bottom: 24px;
                max-width: calc(100% - 48px);
            }
            .char-animate-wrap {
                width: 62%;
                left:40%;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="music-card">
        <div class="bg-layer-1"></div>
        <div class="bg-layer-2"></div>
        <div class="char-animate-wrap">
            <img class="char-gif" src="./img/shouan.gif" alt="角色动图">
            <!--<video class="char-video" src="./img/character.webm" autoplay loop muted playsinline></video>-->
        </div>
        <div class="music-mask">
            <div class="music-title">
                <h1>FASHION</h1>
                <p>AFTER‑TOMORROM</p>
            </div>
            <div class="vinyl-wrap">
                <div class="vinyl" id="vinyl"></div>
            </div>
            <div class="player-bar">
                <div class="progress" id="progressWrap">
                    <div class="progress-inner" id="progressBar"></div>
                </div>
                <div class="control-group">
                    <div class="btn" id="playBtn">▶</div>
                    <span id="timeText">00:00 / 00:00</span>
                </div>
            </div>
        </div>
    </div>
</div>
<audio id="audio" src="./img/music.mp3" preload="metadata">
<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const vinyl = document.getElementById('vinyl');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const timeText = document.getElementById('timeText');
    function formatTime(sec) {
        if (isNaN(sec)) return "00:00";
        let m = Math.floor(sec / 60);
        let s = Math.floor(sec % 60);
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    playBtn.onclick = function () {
        if(audio.paused){
            audio.play().catch(e=>console.log(e));
            playBtn.innerText="⏸";
            vinyl.classList.add("play");
        }else{
            audio.pause();
            playBtn.innerText="▶";
            vinyl.classList.remove("play");
        }
    }
    audio.addEventListener('timeupdate',()=>{
        let per = (audio.currentTime/audio.duration)*100;
        progressBar.style.width = per+"%";
        timeText.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    })
    progressWrap.addEventListener('click',function(e){
        const rect = progressWrap.getBoundingClientRect();
        let p = (e.clientX - rect.left)/rect.width;
        audio.currentTime = audio.duration * p;
    })
    audio.addEventListener('ended',()=>{
        audio.currentTime=0;
        audio.pause();
        playBtn.innerText="▶";
        vinyl.classList.remove("play");
        progressBar.style.width="0%";
    })
</script>
</body>
</html>
